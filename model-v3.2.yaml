maskot:
  id: Maskot-ρ
  version: v3
  holder:
    system_name: "МИМ-Learning-Guild"
    bounded_context: "adult-learning for working SEs"
    scenes_apps:
      - name: reflection_dashboard
        context_card: true
        carriers: [evidence, bridge, gate, badge]
      - name: habit_tracker
        context_card: true
        carriers: [evidence, gate]
  role:
    name: TransformerRole
    purpose: "Cause specified transformations and retain ability"
    allowed_actions: [draw_boundary, assign_badge, toggle_gate, stamp_evidence, author_bridge]
    prohibited_actions: [act_as_episteme, self_measure]
  methods:
    - id: M1_internal_motivation
      meme_ref: good/useful_meme_001.md
      name: Internal Motivation
      inputs: [reflection_log]
      steps: ["extract gain signals","map to values","anchor motivation"]
      outputs: {work_type: TwoLaneCard, fields: [context, role, method_description, work_ref, timestamp]}
      scenes: [reflection_dashboard]
      captions: ["Find your why.","Motivation lives inside.","External push fades."]
      voice_lines: ["Look inward first.","Anchor to purpose.","Drive from within."]
    - id: M2_gradual_progress
      meme_ref: good/useful_meme_008.md
      name: Gradual Progress
      inputs: [weekly_summary]
      steps: ["split goal","record wins","visualize trend"]
      outputs: {work_type: EvidenceTicket, fields: [context, role, method_description, work_ref, timestamp]}
      scenes: [habit_tracker]
      captions: ["Small steps stack.","Progress ≠ rush.","Iterate calmly."]
      voice_lines: ["Record each step.","Growth is accumulation.","Keep momentum."]
  capability:
    envelope:
      throughput_per_period: "10 assets/week"
      max_concurrent_scenes: 3
      latency_targets: "idea→asset ≤48h"
      export_formats: [PNG, SVG, MP4, GIF]
    validity_window:
      starts: "2025-10-11"
      ends: "rolling"
      refresh_cadence: "14d"
      conformance_mode: "M-1"
  media_grammar:
    invariants:
      symbols: [boundary_ring, role_badge, green_gate, bridge_tile, evidence_stamp]
      labeling: [Context, Role, MethodDescription, Work]