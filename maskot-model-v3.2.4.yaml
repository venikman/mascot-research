maskot:
  id: "Maskot-ρ"
  version: "v3.2"
  normative_mapping: "maskot ≡ ⟨holder: U.System, role: TransformerRole ⊑ Role, assignment: U.RoleAssignment: Context, enacts: U.Method via U.MethodDescription, yields: U.Work, ability: U.Capability {envelope, measures, validity}⟩"
  holder:
    system_name: "FPF-SE-Learn"
    bounded_context: "adult-learning for working system engineers"
    scenes_apps:
      - name: "Stand-up"
        context_card: true
        carriers: ["evidence","bridge","gate","badge"]
      - name: "PR review"
        context_card: true
        carriers: ["evidence","bridge","gate","badge"]
      - name: "Habit tracker"
        context_card: true
        carriers: ["evidence","bridge","gate","badge"]
      - name: "Learning log"
        context_card: true
        carriers: ["evidence","bridge","gate","badge"]
      - name: "Weekly retro"
        context_card: true
        carriers: ["evidence","bridge","gate","badge"]
  role:
    name: "Constructor"
    purpose: "Cause specified transformations and retain ability to do so again"
    allowed_actions: ["draw_boundary","assign_badge","toggle_gate","stamp_evidence","author_bridge"]
    prohibited_actions: ["act_as_episteme","self_measure"]
  methods:
    - id: "M1"
      meme_ref: "good/useful_meme_001.md"
      name: "InternalMotivationAnchor"
      inputs: ["reflection_journal","gain_note","goal_card"]
      steps: ["draw_boundary","assign_badge","stamp_evidence","author_bridge","toggle_gate"]
      outputs:
        work_type: "EvidenceTicket"
        fields: ["context","role","method_description","work_ref","timestamp"]
      scenes: ["Habit tracker","Weekly retro","Learning log"]
      captions: ["Boundary first. Then act.","Evidence wears a date.","Bridge it, or don’t mix."]
      voice_lines: ["Draw the room.","Note the change.","Bridge to next step."]
    - id: "M2"
      meme_ref: "good/useful_meme_008.md"
      name: "StepwiseProgress"
      inputs: ["weekly_reflection","tiny_step_backlog","time_box"]
      steps: ["draw_boundary","stamp_evidence","author_bridge","toggle_gate","assign_badge"]
      outputs:
        work_type: "TwoLaneCard"
        fields: ["context","role","method_description","work_ref","timestamp"]
      scenes: ["Habit tracker","Stand-up","Learning log"]
      captions: ["Plan ≠ Run. Keep both.","Small step. Green gate.","Progress compounds. Log it."]
      voice_lines: ["Recipe here, run there.","Gate the next step.","Log the win."]
    - id: "M3"
      meme_ref: "good/useful_meme_003.md"
      name: "ErrorToTest"
      inputs: ["claim","rival_explanations","critical_test"]
      steps: ["draw_boundary","stamp_evidence","author_bridge","toggle_gate"]
      outputs:
        work_type: "EvidenceTicket"
        fields: ["context","role","method_description","work_ref","timestamp"]
      scenes: ["PR review","Design doc","Weekly retro"]
      captions: ["Good tests kill bad ideas.","Critique, then act.","Evidence wears a date."]
      voice_lines: ["Propose. Critique. Test.","Make it hard to vary.","Record the result."]
    - id: "M4"
      meme_ref: "good/useful_meme_009.md"
      name: "RoutineSystemization"
      inputs: ["weekly_template","schedule_block","support_tool_link"]
      steps: ["draw_boundary","assign_badge","author_bridge","toggle_gate","stamp_evidence"]
      outputs:
        work_type: "TwoLaneCard"
        fields: ["context","role","method_description","work_ref","timestamp"]
      scenes: ["Learning log","Habit tracker","Stand-up"]
      captions: ["Badge → Gate → Go.","Plan ≠ Run. Keep both.","Practice beats intention."]
      voice_lines: ["Wear the right badge.","Split plan from run.","Green gate? Proceed."]
    - id: "M5"
      meme_ref: "good/useful_meme_002.md"
      name: "DisciplineLoop"
      inputs: ["self_check_prompts","repeat_questions","reset_ritual"]
      steps: ["draw_boundary","assign_badge","toggle_gate","stamp_evidence","author_bridge"]
      outputs:
        work_type: "BadgeStamp"
        fields: ["context","role","method_description","work_ref","timestamp"]
      scenes: ["Habit tracker","Learning log"]
      captions: ["Badge on. Focus on run.","Discipline is scheduled.","Boundary first. Then act."]
      voice_lines: ["Check. Gate. Execute.","Badge on. Distractions off.","Log. Reset. Continue."]
  work_catalog:
    - name: "ContextCard"
      purpose: "Declare room of meaning"
    - name: "BadgeStamp"
      purpose: "Role assignment confirmation"
    - name: "TwoLaneCard"
      purpose: "Plan≠Run separation"
    - name: "TwoBoxVerdict"
      purpose: "Service vs Capability triage"
    - name: "EvidenceTicket"
      purpose: "Anchor claim to carrier/time/polarity"
    - name: "BridgeChip"
      purpose: "Alignment + reuse record"
  capability:
    envelope:
      throughput_per_period: "12 assets/week"
      max_concurrent_scenes: "4"
      latency_targets: "idea→asset ≤48h; loop ≤24h"
      export_formats: ["PNG","SVG","MP4","GIF"]
      resource_budgets: "Avail_B(q*): 2 animator-days/week; 1 sound-hour/asset"
    measures:
      - name: "gate_pass_rate"
        unit: "%"
      - name: "evidence_attach_rate"
        unit: "%"
      - name: "bridge_reuse_count"
        unit: "count"
      - name: "adoption_in_scene"
        unit: "count"
    validity_window:
      starts: "2025-10-11"
      ends: "rolling"
      refresh_cadence: "biweekly"
      conformance_mode: "M-1"
  media_grammar:
    invariants:
      symbols: ["boundary_ring","role_badge","green_gate","bridge_tile","evidence_stamp"]
      labeling: ["Context","Role","MethodDescription","Work"]
    variable_slots:
      badge_icon: "constructor-gear"
      card_color: "context-blue"
      micro_prop: "scene-specific sticky_note"
    palette:
      primary: "#0B5FFF"
      info: "#2E7DD7"
      approve: "#10B981"
      warn: "#F59E0B"
      block: "#EF4444"
      contrast: ">= WCAG AA"
    poses:
      count: "10"
      library_examples: ["Point-the-Boundary","Badge-On","Green-Gate","Blocked","Bridge-Build","Evidence-Stamp","Plan/Run Split","Service≠Capability","Observe","Handoff"]
    gesture_signals: ["boundary_sweep","badge_flip","check_tick","gate_toggle","bridge_click"]
    motion_loops:
      duration_hint_s: "2–3"
      types: ["Boundary Sweep","Badge Flip","Gate Pulse","Bridge Snap"]
    camera_framing: ["hero_medium","over-the-shoulder_to_card","top-down_desk"]
    background_style: ["clean_grid","blueprint_lines","sticky_note_cards"]
    captions_templates: ["Boundary first. Then act.","Badge → Gate → Go.","Service ≠ Capability.","Plan ≠ Run. Keep both.","Bridge it, or don’t mix.","Evidence wears a date."]
    voice_lines_examples: ["Draw the room.","Wear the right badge.","Green gate? Proceed.","Recipe here, run there.","Promise out, ability in."]
    audio_cues: ["ring_draw_whoosh","badge_flip_clack","gate_tri_tone","bridge_click"]
    export:
      aspect_ratios: ["9:16","1:1","16:9"]
      base_resolution: ">=1080"
      stills: "PNG"
      vectors: "SVG"
      loops: ["MP4/H.264","GIF<=3s"]
      alt_text_rule: "Describe pose+action plainly"
  guardrails:
    do: ["show Context on cards","keep labels distinct","use high contrast"]
    dont: ["anthropomorphize documents","use vendor logos","mix plan with run"]
    principles: ["only systems act","measurement is external","no self-action"]
  data:
    memes_source: "Memes.md"
    meme_selection_rule: "popularity"
    notes: "Memes stress gradual progress, discipline, systematic practice; methods parameterized accordingly."